<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>홈</title>
</head>
<body>
<h1>🎵 YouTubeMusic 클론 - 홈</h1>

<div>
    <p><strong th:text="'환영합니다, ' + ${user.username} + '님!'"></strong></p>
    <p>당신의 아이디: <span th:text="${user.userId}"></span></p>
</div>

<hr>

<p>이곳은 로그인 후 접근 가능한 홈 화면입니다.</p>

<button type="button" onclick="logout()">로그아웃</button>

<script>
    async function logout() {
      await fetch("/api/users/logout", {
        method: "POST",
        credentials: "include"
      });
      window.location.href = "/login"; // ✅ 세션 초기화 후 로그인 페이지로 이동
    }
</script>
</body>
</html>
