<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Music Streaming API Inspector</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #121212; color: #f2f2f2; }
    h1 { margin-bottom: 0; }
    p.note { color: #bbb; margin-top: 4px; }
    section { border: 1px solid #333; padding: 12px 16px; margin-bottom: 18px; border-radius: 8px; background: #181818; }
    label { display: block; margin-top: 8px; font-size: 0.9rem; }
    input[type="text"], input[type="number"], textarea { width: 100%; padding: 6px 8px; margin-top: 4px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; }
    button { margin-top: 10px; padding: 8px 16px; border: none; border-radius: 4px; background: #1db954; color: #111; cursor: pointer; font-weight: bold; }
    button:hover { background: #1ed760; }
    pre { background: #000; padding: 12px; border-radius: 8px; overflow: auto; max-height: 320px; }
    .split { display: flex; flex-wrap: wrap; gap: 12px; }
    .split > div { flex: 1 1 320px; }
  </style>
</head>
<body>
<h1>Music Streaming API Inspector</h1>
<p class="note">JWT와 API Base URL을 넣고 각 섹션의 버튼을 누르면 JSON 응답을 바로 확인할 수 있습니다.</p>

<section>
  <label>API Base URL</label>
  <input type="text" id="baseUrl" value="http://localhost:8080" />
  <label>Authorization 헤더 (예: <code>Bearer eyJ...</code>)</label>
  <textarea id="authHeader" rows="2" placeholder="보호된 API 호출 시에만 입력"></textarea>
  <button onclick="clearResults()">결과 지우기</button>
</section>

<div id="results"></div>

<section>
  <h2>Home</h2>
  <div class="split">
    <div>
      <label>Seed Track IDs (콤마로 구분, optional)</label>
      <input type="text" id="homeSeeds" placeholder="3n3Ppam7vgaVa1iaRUc9Lp,..." />
      <button onclick="callApi('GET', '/api/home/recommendations', { seedTrackIds: document.getElementById('homeSeeds').value })">추천 트랙</button>
    </div>
    <div>
      <button onclick="callApi('GET', '/api/home/new-releases')">신규 앨범</button>
    </div>
  </div>
</section>

<section>
  <h2>Search</h2>
  <label>Query</label>
  <input type="text" id="searchQuery" placeholder="artist, album, track" />
  <button onclick="callApi('GET', '/api/search', { query: document.getElementById('searchQuery').value })">검색</button>
</section>

<section>
  <h2>Album</h2>
  <label>Album ID</label>
  <input type="text" id="albumId" placeholder="Spotify Album ID" />
  <button onclick="callApi('GET', `/api/albums/${document.getElementById('albumId').value}`)">앨범 정보</button>
</section>

<section>
  <h2>Artist</h2>
  <label>Artist ID</label>
  <input type="text" id="artistId" placeholder="Spotify Artist ID" />
  <div class="split">
    <div><button onclick="callApi('GET', `/api/artists/${document.getElementById('artistId').value}`)">기본 정보</button></div>
    <div><button onclick="callApi('GET', `/api/artists/${document.getElementById('artistId').value}/top-tracks`)">Top Tracks</button></div>
    <div><button onclick="callApi('GET', `/api/artists/${document.getElementById('artistId').value}/albums`)">앨범 목록</button></div>
  </div>
</section>

<section>
  <h2>Tracks</h2>
  <label>Spotify Track ID</label>
  <input type="text" id="trackId" placeholder="예: 3n3Ppam7vgaVa1iaRUc9Lp" />
  <div class="split">
    <div><button onclick="callApi('GET', `/api/tracks/${trackIdVal()}`)">트랙 상세</button></div>
    <div><button onclick="callApi('GET', `/api/tracks/${trackIdVal()}/lyrics`)">가사 조회</button></div>
    <div><button onclick="callApi('GET', `/api/tracks/${trackIdVal()}/playbacks`)">재생 로그</button></div>
  </div>
  <label>가사 입력</label>
  <textarea id="lyricsText" rows="4"></textarea>
  <button onclick="callApi('PUT', `/api/tracks/${trackIdVal()}/lyrics`, null, { lyrics: document.getElementById('lyricsText').value })">가사 저장</button>
  <button onclick="callApi('POST', `/api/tracks/${trackIdVal()}/playbacks`)">재생 로그 남기기</button>
</section>

<section>
  <h2>Playlist</h2>
  <div class="split">
    <div><button onclick="callApi('GET', '/api/playlists/me')">내 플레이리스트</button></div>
    <div>
      <label>Playlist ID</label>
      <input type="number" id="playlistId" min="1" />
      <button onclick="callApi('GET', `/api/playlists/${playlistIdVal()}`)">플레이리스트 상세</button>
      <button onclick="callApi('GET', `/api/player/playlists/${playlistIdVal()}`)">재생 큐</button>
    </div>
  </div>
  <label>재정렬 Track ID 배열 (JSON)</label>
  <input type="text" id="reorderIds" placeholder="[1,2,3]" />
  <button onclick="callApi('POST', `/api/playlists/${playlistIdVal()}/tracks/reorder`, null, { orderedTrackIds: JSON.parse(document.getElementById('reorderIds').value) })">트랙 순서 변경</button>
</section>

<section>
  <h2>Player & Search</h2>
  <label>Search Query</label>
  <input type="text" id="playerSearch" />
  <div class="split">
    <div><button onclick="callApi('GET', '/api/player/search', { query: document.getElementById('playerSearch').value })">Playable Search</button></div>
    <div><button onclick="callApi('GET', `/api/player/tracks/${document.getElementById('trackId').value}`)">단일 Track</button></div>
  </div>
</section>

<section>
  <h2>Comments</h2>
  <label>PlaylistTrack ID</label>
  <input type="number" id="playlistTrackId" min="1" />
  <button onclick="callApi('GET', `/api/playlist-tracks/${playlistTrackIdVal()}/comments`)">댓글 조회</button>
  <label>댓글 내용</label>
  <textarea id="commentBody" rows="3"></textarea>
  <label>Parent Comment ID (optional)</label>
  <input type="number" id="parentCommentId" />
  <button onclick="callApi('POST', `/api/playlist-tracks/${playlistTrackIdVal()}/comments`, null, {
    content: document.getElementById('commentBody').value,
    parentId: numberOrNull('parentCommentId')
  })">댓글 작성</button>
</section>

<section>
  <h2>Utilities</h2>
  <button onclick="callApi('GET', '/api/users/me')">내 정보</button>
  <button onclick="callApi('GET', `/api/tracks/${trackIdVal()}/satisfaction/summary`)">만족도 요약</button>
  <button onclick="callApi('GET', `/api/tracks/${trackIdVal()}/like/count`)">좋아요 카운트</button>
</section>

<script>
  const resultsEl = document.getElementById('results');

  function appendResult(title, data) {
    const block = document.createElement('section');
    block.innerHTML = `<strong>${title}</strong><pre>${data}</pre>`;
    resultsEl.prepend(block);
  }

  function clearResults() {
    resultsEl.innerHTML = '';
  }

  function trackIdVal() {
    const value = document.getElementById('trackId').value || '';
    if (!value) throw alert('Track ID를 입력하세요.');
    return value.trim();
  }

  function playlistIdVal() {
    const value = document.getElementById('playlistId').value;
    if (!value) throw alert('Playlist ID를 입력하세요.');
    return value;
  }

  function playlistTrackIdVal() {
    const value = document.getElementById('playlistTrackId').value;
    if (!value) throw alert('PlaylistTrack ID를 입력하세요.');
    return value;
  }

  function numberOrNull(id) {
    const value = document.getElementById(id).value;
    if (!value) return null;
    const parsed = Number(value);
    return Number.isNaN(parsed) ? null : parsed;
  }

  async function callApi(method, path, query = null, body = null) {
    try {
      const base = document.getElementById('baseUrl').value.replace(/\/$/, '');
      const url = new URL(base + path);
      if (query) {
        Object.entries(query).forEach(([key, val]) => {
          if (val && val.length !== 0) {
            if (Array.isArray(val)) {
              val.forEach(v => url.searchParams.append(key, v));
            } else {
              url.searchParams.set(key, val);
            }
          }
        });
      }

      const headers = { 'Content-Type': 'application/json' };
      const auth = document.getElementById('authHeader').value.trim();
      if (auth) headers['Authorization'] = auth;

      const response = await fetch(url.toString(), {
        method,
        headers,
        body: body ? JSON.stringify(body) : null,
      });

      const text = await response.text();
      let parsed;
      try {
        parsed = JSON.parse(text);
      } catch (err) {
        parsed = text;
      }
      appendResult(`${method} ${url.pathname}${url.search} [${response.status}]`, JSON.stringify(parsed, null, 2));
    } catch (error) {
      appendResult('ERROR', error.message);
    }
  }
</script>
</body>
</html>
